# macOS arm64 .app and .dmg. Build from the repo root with `bun run dist:desktop` (docs/build.md):
# apps/desktop/scripts/bundle.sh compiles the server (apps/server/dist/printtally-server, with the UI in client/
# beside it), writes dist/build-info.json and builds the signed .app; apps/desktop/scripts/make-dmg.sh then makes the .dmg.
appId: com.olliespage.PrintTally
productName: Print Tally
directories:
  output: release
  buildResources: build
files: [dist/**/*]
# The packaged app runs <Resources>/server/printtally-server (src/server-manager.ts), which serves the
# UI from client/ beside itself.
extraResources:
  - { from: ../server/dist/printtally-server, to: server/printtally-server }
  - { from: ../server/dist/client, to: server/client }
  # apps/desktop/scripts/make-icon.sh compiles this asset catalog; Finder and the Dock read it via
  # CFBundleIconName (mac.extendInfo below), falling back to mac.icon's .icns only where the catalog can't apply.
  - { from: assets/icon/Assets.car, to: Assets.car }
  # electron-updater reads this even though src/updater.ts sets the feed itself. electron-builder only writes it for
  # zip and dmg targets, and bundle.sh builds a dir, so it's checked in.
  - { from: build/app-update.yml, to: app-update.yml }
# Gives the main executable, the helpers and the server their own Mach-O UUIDs, which macOS Local Network privacy
# tracks them by (scripts/macho-uuid.ts). It runs before signing; `--prepackaged` (make-dmg.sh) skips it.
afterPack: ./scripts/after-pack.mjs
# Electron fuses: the signed binary can't be reused as a Node runtime or debugged through
# environment variables or flags, and only loads its own, integrity-checked app.asar.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
protocols:
  - { name: Print Tally pairing link, schemes: [printtally] }
mac:
  target: [{ target: dmg, arch: arm64 }]
  category: public.app-category.productivity
  # apps/desktop/scripts/make-icon.sh renders assets/icon/print-tally.svg into this and Assets.car above.
  icon: assets/icon/PrintTally.icns
  # apps/desktop/scripts/bundle.sh picks the identity, and turns on the hardened runtime and a secure timestamp for
  # release builds (PRINTTALLY_RELEASE=1). The entitlements cover every executable, the server included.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # The release workflow notarizes with notarytool (.github/workflows/release.yml); local builds never are.
  notarize: false
  # Local Network privacy: the bundled server connects to the printer on the local network, and macOS attributes
  # that to this app. Without a usage description the connection is refused without asking.
  extendInfo:
    NSLocalNetworkUsageDescription: Print Tally connects to your printer on the local network to read its job log.
    NSBonjourServices: [_ipp._tcp, _ipps._tcp, _printer._tcp]
    # Finder and the Dock use the Assets.car catalog (extraResources above) under this name instead of mac.icon's .icns.
    CFBundleIconName: AppIcon
# Built by apps/desktop/scripts/make-dmg.sh from the signed app, which signs the .dmg itself. It passes the background,
# apps/desktop/assets/dmg/background.svg rendered to background.png with background@2x.png beside it; the 660x400 window
# takes its size from the image. The volume icon defaults to mac.icon above, so it's not repeated here.
dmg:
  title: ${productName}
  artifactName: PrintTally-${version}.${ext}
  iconSize: 128
  iconTextSize: 13
  contents:
    - { x: 165, y: 190 }
    - { x: 495, y: 190, type: link, path: /Applications }
  sign: false
  writeUpdateInfo: false
